# Tema visual de la app (Streamlit lo lee automáticamente, también en Streamlit Cloud)
[theme]
base = "light"
primaryColor = "#1d4ed8"             # azul rey: botones, sliders, pestañas y filtros elegidos
backgroundColor = "#f5f9ff"          # blanco azulado
secondaryBackgroundColor = "#e8f1fd" # fondo de cajas y controles
textColor = "#0f1e33"                # azul marino muy oscuro
linkColor = "#1d4ed8"
borderColor = "#c7dbf5"              # bordes azul claro
dataframeBorderColor = "#c7dbf5"
dataframeHeaderBackgroundColor = "#dbeafe"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "sans-serif"
headingFont = "serif"
# Colores por defecto de las gráficas: primero el azul
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a"]
# Escala de claro a oscuro (celeste → azul marino) para gráficas de magnitud
chartSequentialColors = ["#e3eefc", "#c4dbf8", "#9fc3f3", "#76a8ec", "#4f8de3",
                         "#2f73d6", "#1f5fbf", "#1a4d9c", "#163d7a", "#112e5c"]

# Barra lateral en azul claro, para que se distinga del resto
[theme.sidebar]
backgroundColor = "#dbeafe"
secondaryBackgroundColor = "#eff6ff"
borderColor = "#b9d3f3"

[browser]
gatherUsageStats = false
